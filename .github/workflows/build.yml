---
name: build
on:
  pull_request:
    branches:
      - main
      - testing
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
      - testing
    paths-ignore:
      - '**.md'
      - '**.txt'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  BASE_IMAGE: "ghcr.io/ublue-os/base-main"
  BASE_TAG: "latest"
  ARG_IMAGE_TAG: "${{ github.ref_name }}"

jobs:
  push-ghcr:
    name: Build and push image
    runs-on: ubuntu-24.04
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: goosex
            description: "given's own operating system experiment with Nix"
          - image: goose
            description: "given's own operating system experiment"
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # Checkout push-to-registry action GitHub repository
      - name: Checkout Push to Registry action
        uses: actions/checkout@v4

      - name: Check just syntax
        uses: ublue-os/just-action@v2

      - name: Generate tags
        id: generate-tags
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              if [[ "${{ github.base_ref}}" == "main" ]]; then
                  echo ARG_IMAGE_TAG="stable" >> $GITHUB_ENV
              fi
          fi

          # Generate a timestamp for creating an image version history
          TIMESTAMP="$(date +%Y%m%d)"
          VARIANT="${{ env.ARG_IMAGE_TAG }}"

          if [[ "${VARIANT}" == "main" ]]; then
              VARIANT="stable"
              echo ARG_IMAGE_TAG="stable" >> $GITHUB_ENV
          fi

          COMMIT_TAGS=()
          BUILD_TAGS=()
          TESTING_TAGS=()

          # Have tags for tracking builds during pull request
          SHA_SHORT="${GITHUB_SHA::7}"

          COMMIT_TAGS+=("pr-${{ github.event.number }}")
          COMMIT_TAGS+=("${SHA_SHORT}")

          # Tags for tracking builds during testing
          TESTING_TAGS+=("${SHA_SHORT}-${VARIANT}")
          TESTING_TAGS+=("${SHA_SHORT}")
          TESTING_TAGS+=("${VARIANT}")

          # Append matching timestamp tags to keep a version history
          for TAG in "${TESTING_TAGS[@]}"; do
              TESTING_TAGS+=("${TAG}-${TIMESTAMP}")
          done

          BUILD_TAGS=("${VARIANT}")
          BUILD_TAGS+=("latest")

          # Append matching timestamp tags to keep a version history
          for TAG in "${BUILD_TAGS[@]}"; do
              BUILD_TAGS+=("${TAG}-${TIMESTAMP}")
          done

          BUILD_TAGS+=("${TIMESTAMP}")

          if [[ "${{ github.ref_name }}" == "testing" ]]; then
              echo "Generated the following testing tags: "
              for TAG in "${TESTING_TAGS[@]}"; do
                  echo "${TAG}"
              done

              alias_tags=("${TESTING_TAGS[@]}")

          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
              echo "Generated the following commit tags: "
              for TAG in "${COMMIT_TAGS[@]}"; do
                  echo "${TAG}"
              done

              alias_tags=("${COMMIT_TAGS[@]}")
          else
              alias_tags=("${BUILD_TAGS[@]}")
          fi

          echo "Generated the following build tags: "
          for TAG in "${BUILD_TAGS[@]}"; do
              echo "${TAG}"
          done

          # Fully qualified references, one per line (registry owner must be lowercase)
          REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          {
              echo "tags<<EOF"
              for TAG in "${alias_tags[@]}"; do
                  echo "${REGISTRY}/${{ matrix.image }}:${TAG}"
              done
              echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Get current version
        id: labels
        run: |
          ver=$(skopeo inspect "docker://${{ env.BASE_IMAGE }}:${{ env.BASE_TAG }}" | jq -r '.Labels["org.opencontainers.image.version"]')
          echo "VERSION=$ver" >> $GITHUB_OUTPUT

      # Build metadata
      - name: Image Metadata
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ${{ matrix.image }}

          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository }}/main/README.md
            io.artifacthub.package.logo-url=https://raw.githubusercontent.com/${{ github.repository }}/main/assets/logo.jpg
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.version=${{ steps.labels.outputs.VERSION }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          target: ${{ matrix.image }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.generate-tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            BASE_TAG=${{ env.BASE_TAG }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - uses: sigstore/cosign-installer@v3.8.2
        if: github.event_name != 'pull_request'

      - name: Sign container image
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          DIGEST: ${{ steps.build_push.outputs.digest }}
          TAGS: ${{ steps.generate-tags.outputs.tags }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          # Sign by digest; every tag points at the same manifest
          REPO="$(head -n1 <<< "${TAGS}" | cut -d: -f1)"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "${REPO}@${DIGEST}"
