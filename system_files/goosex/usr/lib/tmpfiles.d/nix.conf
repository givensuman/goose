# writable Nix store
C /var/lib/nix 0755 root root - /usr/share/factory/nix
d /var/lib/nix 0755 root root -
# the daemon socket unit requires this directory to exist (ConditionPathIsReadWrite)
d /var/lib/nix/var/nix/daemon-socket 0755 root root -
d /var/lib/nix/var/nix/db 0755 root root -
d /var/lib/nix/var/nix/gcroots 0755 root root -
d /var/lib/nix/var/nix/profiles 0755 root root -
d /var/lib/nix/var/nix/temproots 0755 root root -
d /var/lib/nix/var/nix/userpool 0755 root root -
# store must be group-owned by the build users
z /var/lib/nix/store 1775 root nixbld -
